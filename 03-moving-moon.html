<!DOCTYPE html>
<html>
<head><title>Moving moon</title></head>
<body>
<canvas id="canvas" width="500" height="300"
        style="border:1px solid black"></canvas>
<script>
let canvas = document.getElementById("canvas");
let g = canvas.getContext("2d");
let x = 30;

function draw() {
  g.clearRect(0, 0, 500, 300);
  g.beginPath();
  g.arc(x, 100, 20, 0, 2 * Math.PI);
  g.stroke();

  if (x < 470) x = x + 2;
}
setInterval(draw, 20);
</script>
</body>
</html>
